version: "3.8"

services:

  mariadb:
    image: mariadb:10.6
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
        - 127.0.0.1:${MYSQL_EXPOSED_PORT}:3306
    volumes:
     - mysql_data:/var/lib/mysql
    networks:
      - global_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:fpm-alpine
    container_name: phpmyadmin
    restart: always
    environment:
      PMA_HOST: mariadb
      PMA_ABSOLUTE_URI: http://localhost:${PHPMYADMIN_SERVER_PORT}/
    volumes:
      - phpmyadmin_data:/var/www/html/
    networks:
      - global_network
    depends_on:
      - mariadb

  nginx:
    image: nginx:1.17.4-alpine
    container_name: phpmyadmin_server
    restart: always
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - phpmyadmin_data:/var/www/html/:ro
    ports:
      - 127.0.0.1:${PHPMYADMIN_SERVER_PORT}:80
    networks:
      - global_network
    depends_on:
      - phpmyadmin

networks:
  global_network:
    name: global_network

volumes:
  mysql_data:
    name: mysql_data

  phpmyadmin_data:
    name: phpmyadmin_data
