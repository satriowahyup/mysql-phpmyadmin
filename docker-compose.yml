version: "3.8"

services:

  mysql:
    image: mysql:5.7.34
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports: 
      - 127.0.0.1:${MYSQL_EXPOSED_PORT}:3306
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    healthcheck:
      test: mysqladmin ping -h 127.0.0.1 -u root --password=$$MYSQL_ROOT_PASSWORD
      interval: 5s
      retries: 10
    networks:
      - global_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:fpm-alpine
    container_name: phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_ABSOLUTE_URI: http://localhost:${PHPMYADMIN_SERVER_PORT}/
    volumes:
      - phpmyadmin_data:/var/www/html/
    networks:
      - global_network
    depends_on:
      - mysql

  nginx:
    image: nginx:1.17.4-alpine
    container_name: phpmyadmin_server
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - phpmyadmin_data:/var/www/html/:ro
    ports:
      - 127.0.0.1:${PHPMYADMIN_SERVER_PORT}:80
    networks:
      - global_network
    depends_on:
      - phpmyadmin

networks:
  global_network:
    name: global_network

volumes:
  mysql_data:
    name: mysql_data

  phpmyadmin_data:
    name: phpmyadmin_data